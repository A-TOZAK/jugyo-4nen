<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>理科 第1時｜4年 今週の授業</title>
<meta name="description" content=""><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15181c;--sub:#5f646b;--line:#e2e2de;--wash:#f6f6f4;--paper:#fff;--accent:#2b5fd9;
--red:#c8372d;--blue:#2a5db0;--rika:#2a7a6a;--kokugo:#b0532a;--teian:#8a6d1f;--done:#8a8f96;
--font:"BIZ UDPGothic","BIZ UDGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e9eaec;--sub:#a6abb2;--line:#3a3d43;
--wash:#202226;--paper:#16181b;--accent:#7ea2ff;--red:#ff8a7e;--blue:#8fb0ff;--rika:#6cc7b3;--kokugo:#f0a07a;--teian:#e0c068;--done:#80858c}}
:root[data-theme="dark"]{--ink:#e9eaec;--sub:#a6abb2;--line:#3a3d43;--wash:#202226;--paper:#16181b;--accent:#7ea2ff;
--red:#ff8a7e;--blue:#8fb0ff;--rika:#6cc7b3;--kokugo:#f0a07a;--teian:#e0c068;--done:#80858c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px}
a{color:var(--accent)}
header.site{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
header.site .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
header.site .brand{font-weight:700;text-decoration:none;color:var(--ink);margin-right:auto}
header.site nav{display:flex;flex-wrap:wrap;gap:4px}
header.site nav a{text-decoration:none;color:var(--ink);padding:4px 10px;border-radius:999px;font-size:.92rem}
header.site nav a.on{background:var(--ink);color:var(--paper)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:1.6rem;line-height:1.35;margin:.4em 0 .2em;word-break:auto-phrase}
h2{font-size:1.25rem;line-height:1.4;margin:2.2em 0 .6em;padding-top:.2em;border-top:2px solid var(--ink);word-break:auto-phrase}
h3{font-size:1.06rem;margin:1.6em 0 .4em;word-break:auto-phrase}
p.lead{color:var(--sub);margin:.2em 0 1.2em}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.rika{color:var(--rika)}.chip.kokugo{color:var(--kokugo)}.chip.teian{color:var(--teian)}.chip.done{color:var(--done)}
.points{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:12px 0}
.points div{background:var(--wash);border-radius:10px;padding:14px 16px}
.points b{display:block;line-height:1.5;margin-bottom:6px;word-break:auto-phrase}
.points p{margin:0;font-size:.93rem;color:var(--sub)}
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.day{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.day h3{margin:0 0 4px}
.day .note{font-size:.85rem;color:var(--sub);margin:0 0 6px}
.day ol{margin:0;padding:0;list-style:none}
.day li{display:grid;grid-template-columns:1.6em 1fr;gap:6px;padding:5px 0;border-top:1px dashed var(--line);font-size:.93rem;line-height:1.55}
.day li:first-child{border-top:0}
.day li .n{color:var(--sub);font-weight:700}
.day li.rika .s{color:var(--rika);font-weight:700}.day li.kokugo .s{color:var(--kokugo);font-weight:700}.day li.teian .s{color:var(--teian);font-weight:700}
.day li .d{color:var(--sub)}
.day li a{text-decoration:none}
table.t{width:100%;border-collapse:collapse;font-size:.93rem;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.t th{background:var(--wash);font-weight:700}
.tbl{overflow-x:auto}
table.tenkai{min-width:760px}
table.hy td:nth-child(-n+2),table.hy th:nth-child(-n+2){white-space:nowrap}
table.tenkai td:first-child{white-space:nowrap;color:var(--sub)}
table.tenkai td:nth-child(2){font-weight:700;width:16%}
table.tenkai td:nth-child(3){width:38%}
.map{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.map li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.map li.now{border-color:var(--rika);border-width:2px}
.map li.done{color:var(--done)}
.map .w{font-weight:700}
.map .d{display:block;font-size:.85rem;color:var(--sub)}
.box{background:var(--wash);border-radius:10px;padding:14px 16px;margin:12px 0}
.box p{margin:.3em 0}
.mondai{border:2px solid var(--blue);border-radius:8px;padding:10px 14px;font-weight:700;margin:10px 0}
.mondai .lab{color:var(--blue);margin-right:.6em}
.matome{border:2px solid var(--red);border-radius:8px;padding:10px 14px;font-weight:700;margin:10px 0}
.matome .lab{color:var(--red);margin-right:.6em}
.kekka{border-left:4px solid var(--sub);padding:6px 12px;margin:10px 0}
figure{margin:14px 0}
figure img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
figcaption{font-size:.85rem;color:var(--sub);margin-top:4px}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dl a{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;font-size:.9rem;color:var(--ink)}
.dl a::before{content:"PDF　";color:var(--sub);font-size:.78rem}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
.card b{display:block;word-break:auto-phrase}
.card span{font-size:.88rem;color:var(--sub)}
ul.check{list-style:none;padding:0}
ul.check li{padding:4px 0 4px 1.6em;position:relative}
ul.check li::before{content:"□";position:absolute;left:0;color:var(--sub)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.toc a{font-size:.88rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none}
footer{max-width:1000px;margin:0 auto;padding:24px 16px 40px;color:var(--sub);font-size:.8rem;border-top:1px solid var(--line)}
/* 子ども向け */
.kid{font-size:1.06rem}
.kidcard{border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}
.kidcard.rika{border-color:var(--rika)}.kidcard.kokugo{border-color:var(--kokugo)}
.kidcard h3{margin:0 0 8px;font-size:1.2rem}
.kidcard ol{padding-left:1.4em;margin:.3em 0}
.kidcard .wakatta{background:var(--wash);border-radius:10px;padding:10px 14px;font-weight:700;margin:10px 0}
.kidcard .sensei{font-size:.95rem;color:var(--sub)}
/* 掲示物・ワークシート（画面ではちぢめて見せ、印刷では実寸） */
.sheetwrap{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sheetwrap.one{grid-template-columns:1fr}
.paper{container-type:inline-size;border:1px solid var(--line);background:#fff;color:#15181c;border-radius:4px;overflow:hidden}
.cap{font-size:.85rem;color:var(--sub);margin:4px 0 0}

.a3{aspect-ratio:420/297;position:relative;padding:5cqw 6cqw;display:flex;flex-direction:column;justify-content:center;font-family:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans",sans-serif;color:#15181c}
.a3 .ttl{position:absolute;left:6cqw;top:3cqw;font-size:2.1cqw;font-weight:700;color:#5f646b}
.a3 .when{position:absolute;right:4cqw;bottom:2.6cqw;font-size:1.5cqw;color:#8a8f96}
.a3 .ln{font-size:5.6cqw;font-weight:700;line-height:1.45;letter-spacing:.02em}
.a3.blue{border:1.4cqw solid #2a5db0}.a3.red{border:1.4cqw solid #c8372d}.a3.ink{border:1.4cqw solid #15181c}
.a3 .q{display:inline-block;border:.5cqw solid #2a5db0;color:#2a5db0;font-size:4.6cqw;line-height:1;padding:.6cqw 1cqw;margin-right:2cqw;vertical-align:.4cqw}
.a3 .tag{display:inline-block;color:#fff;font-size:4.4cqw;line-height:1.2;padding:.4cqw 2cqw;border-radius:1cqw;margin-right:2.4cqw;vertical-align:.3cqw}
.a3 .tag.red{background:#c8372d}.a3 .tag.blue{background:#2a5db0}
.a3 .lnsm{font-size:4.6cqw}
.a3 table{border-collapse:collapse;width:88cqw;table-layout:fixed;font-size:3.4cqw;font-weight:700}
.a3 td,.a3 th{border:.35cqw solid #15181c;padding:1.2cqw 1.6cqw;text-align:center;height:6.2cqw}
.a3 th{background:#f1f1ee}
.a3.tbl8 td,.a3.tbl8 th{height:4.6cqw;padding:.5cqw 1cqw;font-size:2.9cqw}
.a4{aspect-ratio:210/297;position:relative;padding:7cqw 8cqw 6cqw;word-break:auto-phrase;font-family:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans",sans-serif;color:#15181c;display:flex;flex-direction:column}
.a4 .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5cqw solid #15181c;padding-bottom:1.6cqw;margin-bottom:3cqw}
.a4 .top b{font-size:4.4cqw;line-height:1.3}
.a4 .top span{font-size:2.6cqw;color:#5f646b;white-space:nowrap}
.a4 .name{font-size:3cqw;margin-bottom:3cqw}
.a4 .q{font-size:3.4cqw;font-weight:700;margin:2.4cqw 0 1.2cqw}
.a4 .q small{font-weight:400;color:#5f646b;font-size:2.6cqw;margin-left:1.4cqw}
.a4 .lines{border-top:.25cqw solid #b9bcc2}
.a4 .lines i{display:block;height:7.2cqw;border-bottom:.25cqw dashed #b9bcc2}
.a4 .kata{font-size:2.7cqw;margin-bottom:2cqw;background:#f4f4f1;border-radius:1.4cqw;padding:2cqw 3cqw;line-height:1.7}
.a4 .kata b{color:#2a5db0}
.a4 .grid4{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;flex:1}
.a4 .grid4 div{border:.35cqw solid #15181c;border-radius:1.4cqw;padding:2cqw;font-size:2.7cqw;display:flex;flex-direction:column;gap:1cqw}
.a4 .grid4 div i{flex:1;border-bottom:.25cqw dashed #b9bcc2}
.a4 .k-did{font-size:3.2cqw;line-height:1.7;margin:0;padding-left:5cqw}
.a4 .k-wak{border:.5cqw solid #c8372d;border-radius:1.6cqw;padding:2.4cqw 3cqw;font-size:3.6cqw;font-weight:700;line-height:1.6;margin:1cqw 0 2cqw}
.a4 .k-note{font-size:3.1cqw;line-height:1.7;margin:0 0 3cqw;padding-left:5cqw}
.a4 .k-sensei{margin-top:auto;font-size:2.9cqw;background:#f4f4f1;border-radius:1.4cqw;padding:2.4cqw 3cqw;line-height:1.65}
.a4 .k-h{font-size:3.3cqw;font-weight:700;margin:3cqw 0 1cqw;color:#2a7a6a}
.a4 .cr{position:absolute;right:8cqw;bottom:3cqw;font-size:2cqw;color:#8a8f96}
</style></head><body>

<main><h1>理科　第1時　空気でっぽうで遊んで、問題をつくる</h1><p class="lead"><span class="chip done">済み</span>　運動場・教室</p><div class="mondai"><span class="lab">問題</span>とじこめた空気をおすと、空気の体積と手ごたえは、どうなるのだろうか。</div><div class="box"><p>空気でっぽうで遊び、玉の飛び方と手ごたえの気づきから、体積と手ごたえに目を向けた問題をつくる。</p></div><h2>板書計画</h2><figure><img src="img/r01_bansho.jpg" alt="第1時の板書計画" loading="lazy"></figure><h2>ノート</h2><div class="grid2"><figure><img src="img/r01_note.jpg" alt="第1時の配るノート" loading="lazy"><figcaption>配る紙（B4・5mm方眼）</figcaption></figure><figure><img src="img/r01_note_rei.jpg" alt="第1時のノートの記入例" loading="lazy"><figcaption>記入例（青が子どもの書くところ）</figcaption></figure></div><div class="dl"><a href="files/r01_bansho.pdf">板書計画</a><a href="files/r01_note.pdf">配るノート</a><a href="files/r01_note_rei.pdf">記入例</a></div><div class="toc"><a href="rika-2.html">第2時</a><a href="rika-3.html">第3時</a><a href="rika-4.html">第4時</a><a href="rika.html">単元の地図</a></div></main>
